name: Build CalorPulse Standalone APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-geolocator requests folium "flet[all]"

      - name: Build Android APK
        run: |
          git config --global --add safe.directory "*"
          flet build apk --permissions location --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalorPulse-Release-APK
          path: |
            build/apk/*.apk
            build/apk/app-release.apk
